services:
  - type: web
    name: botsailer-voice
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: PORT
        value: 3000
    disk:
      name: db
      mountPath: /opt/render/project/src
      sizeGB: 1
